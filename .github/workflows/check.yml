name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:test
      - uses: actions/upload-artifact@v4
        with:
          name: gamify-for-siyuan
          path: dist/package.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gamify-for-siyuan-test
          path: dist/package-test.zip
