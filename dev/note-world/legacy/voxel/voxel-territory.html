<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>笔记领地 · 方块地貌 Demo</title>
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../dist/gamify-for-siyuan/terrain/vendor/three.module.js",
          "three/addons/controls/OrbitControls.js": "../../../../dist/gamify-for-siyuan/terrain/vendor/OrbitControls.js"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: #f2ebff; background: #12101d; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body { background: radial-gradient(circle at 50% 10%, #32264d, #12101d 66%); }
      #map { width: 100%; height: 100%; display: block; }
      .toolbar { position: fixed; z-index: 2; left: 18px; top: 16px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #c4a9ef33; border-radius: 12px; background: #1d182dcc; box-shadow: 0 14px 40px #0006; }
      .toolbar strong { color: #f4d692; font-size: 15px; }
      .toolbar span { color: #b8a9c9; font-size: 11px; }
      button, label { border: 1px solid #c4a9ef44; border-radius: 7px; padding: 6px 10px; color: #f1e7ff; background: #342746; cursor: pointer; font: inherit; }
      button:hover, label:hover { border-color: #f4d692; }
      input { display: none; }
      .help { position: fixed; z-index: 2; right: 18px; bottom: 16px; color: #b8a9c9; font-size: 11px; }
      .legend { position: fixed; z-index: 2; right: 18px; top: 18px; padding: 9px 11px; border: 1px solid #c4a9ef22; border-radius: 9px; background: #1d182dcc; color: #cfc0df; font-size: 11px; }
      .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 2px; vertical-align: -1px; }
      .legend .low { background: #477d70; } .legend .high { background: #e2c78c; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>笔记领地 · 方块 Demo</strong>
      <span id="stats">示例数据</span>
      <label>载入 snapshot<input id="file" type="file" accept="application/json,.json" /></label>
      <button id="sample" type="button">示例地貌</button>
      <button id="mode" type="button">进入区域详情</button>
    </div>
    <div class="legend"><i class="low"></i>低地　<i class="high"></i>活跃地标</div>
    <div class="help">拖动旋转　滚轮缩放　点击地标查看笔记</div>
    <canvas id="map"></canvas>
    <script type="module" src="./voxel-territory.js"></script>
  </body>
</html>
